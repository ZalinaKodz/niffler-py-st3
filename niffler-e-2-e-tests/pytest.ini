[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --verbose
    --color=yes
    --tb=short
    -ra
    --alluredir=allure-results
    --clean-alluredir
markers =
    boundary: boundary value tests
    integration: integration tests requiring external services
    performance: performance and load tests
    slow: slow running tests
    unit: unit test
    user_management: User management tests
    friends_management: Friends management tests
    allure_label: Allure label marker
    ui: UI tests
    api: API tests
    grpc: gRPC tests
    kafka: kafka tests
    soap: SOAP API tests